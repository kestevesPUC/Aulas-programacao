<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">

    <title>Cadastro</title>

</head>

<body style="background-color:hsl(0 0% 98%);">
    <header class="mb-4 pb-5">
        <!-- NAVBAR FIXA NO TOPO -->
        <nav class="navbar bg-body-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#">
                    <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30"
                        height="24" class="d-inline-block align-text-top">
                    Library
                </a>
            </div>
        </nav>
    </header>

    <main class="container-fluid">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div class="ms-3">
                <h1 class="text-2xl font-bold text-foreground">Cadastro</h1>
                <p class="text-muted-foreground">Tela para cadastro de um novo livro</p>
            </div>
        </div>


        <div class="row">
            <div class="col-md-4 col-sm-12">
                <div class="form-floating mt-3">
                    <input type="text" class="form-control" id="nome" placeholder="">
                    <label for="nome">Nome</label>
                </div>
            </div>

            <div class="col-md-4 col-sm-12">
                <div class="form-floating mt-3">
                    <input type="text" class="form-control" id="autor" placeholder="">
                    <label for="autor">Autor</label>
                </div>
            </div>

            <div class="col-md-4 col-sm-12">
                <div class="form-floating mt-3">
                    <input type="text" class="form-control" id="preco" placeholder="">
                    <label for="preco">Preço</label>
                </div>
            </div>
        </div>

        <div class="row">

            <div class="col-md-4 col-sm-12">
                <div class="form-floating mt-3">
                    <input type="text" class="form-control" id="genero" placeholder="">
                    <label for="genero">Genero</label>
                </div>
            </div>

            <div class="col-md-4 col-sm-12">
                <div class="form-floating mt-3">
                    <input type="date" class="form-control" id="lancamento" placeholder="">
                    <label for="lancamento">Lançamento</label>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <div class="form-floating">
                    <textarea class="form-control" placeholder="" id="floatingTextarea2"
                        style="height: 100px"></textarea>
                    <label for="floatingTextarea2">Sinopse</label>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <button type="button" class="btn btn-primary" id="btn_salvar" onclick="clickSalvar()">Salvar</button>
            </div>
        </div>
    </main>

    <script src="./js/index.js"></script>
</body>

</html>
